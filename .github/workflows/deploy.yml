name: Deploy ShoftAfrica App to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_IP }}
          username: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_USERNAME }}
          key: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_SSH_KEY }}
          command_timeout: 25m
          script: |
            cd /var/www/ShoftAfricaAppsCatalogue || exit

            # 1. Pull latest changes
            git pull origin main

            # 2. Clean docker cache
            docker system prune -f

            # 3. Install dependencies & build with increased memory allocation
            export NODE_OPTIONS="--max-old-space-size=1024"
            npm install --legacy-peer-deps
            CI=false npm run build || { echo 'Build failed!'; exit 1; }

            # 4. Generate Dockerfile on the fly
            echo "FROM nginx:stable-alpine
            RUN echo 'server { \
                listen 80; \
                location / { \
                    root /usr/share/nginx/html; \
                    index index.html index.htm; \
                    try_files \$uri \$uri/ /index.html; \
                } \
            }' > /etc/nginx/conf.d/default.conf
            COPY build/ /usr/share/nginx/html
            EXPOSE 80
            CMD [\"nginx\", \"-g\", \"daemon off;\"]" > Dockerfile.simple

            # 5. Build Docker image
            docker build -t shoft-africa-apps-catalogue:latest -f Dockerfile.simple .

            # 6. Swap container
            docker stop shoft-africa-apps-catalogue-container || true
            docker rm shoft-africa-apps-catalogue-container || true
            
            docker run -d \
              --name shoft-africa-apps-catalogue-container \
              --restart always \
              -p 127.0.0.1:3000:80 \
              shoft-africa-apps-catalogue:latest