name: Deploy ShoftAfrica App to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_IP }}
          username: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_USERNAME }}
          key: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_SSH_KEY }}
          command_timeout: 20m
          script: |
            # 1. Enter the folder
            cd /var/www/ShoftAfricaAppsCatalogue || exit

            # 2. Update code
            git pull origin main

            # 3. Safe Cleanup
            docker system prune -f
            
            # 4. Build Process
            npm install --legacy-peer-deps
            npm run build || { echo 'Build failed! Keeping old version.'; exit 1; }
            
            # 5. Generate Dockerfile
            echo "FROM nginx:stable-alpine
            RUN echo 'server { \
                listen 80; \
                location / { \
                    root /usr/share/nginx/html; \
                    index index.html index.htm; \
                    try_files \$uri \$uri/ /index.html; \
                } \
            }' > /etc/nginx/conf.d/default.conf
            COPY build/ /usr/share/nginx/html
            EXPOSE 80
            CMD [\"nginx\", \"-g\", \"daemon off;\"]" > Dockerfile.simple
            
            # 6. Build the NEW image
            docker build -t shoft-africa-apps-catalogue:latest -f Dockerfile.simple . || { echo 'Docker build failed!'; exit 1; }
            
            # 7. THE SWAP
            echo "Deployment successful. Swapping containers now..."
            docker stop shoft-africa-apps-catalogue-container || true
            docker rm shoft-africa-apps-catalogue-container || true
            
            docker run -d \
              --name shoft-africa-apps-catalogue-container \
              --restart always \
              -p 127.0.0.1:3000:80 \
              shoft-africa-apps-catalogue:latest