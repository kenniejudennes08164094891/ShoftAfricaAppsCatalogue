name: Deploy ShoftAfrica App to AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build -- --configuration=production
        env:
          CI: false

      - name: Deploy Build to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_IP }}
          username: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_USERNAME }}
          key: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_SSH_KEY }}
          source: "build/*"
          target: "/home/admin/shoft_catalogue_build"
          strip_components: 0
          rm: true

      - name: Update Container on Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_IP }}
          username: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_USERNAME }}
          key: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_SSH_KEY }}
          script: |
            # 1. Ensure target directory exists
            sudo mkdir -p /var/www/ShoftAfricaAppsCatalogue/build
            
            # 2. Move the new build files into place
            sudo rm -rf /var/www/ShoftAfricaAppsCatalogue/build/*
            sudo cp -r /home/admin/shoft_catalogue_build/* /var/www/ShoftAfricaAppsCatalogue/build/
            
            cd /var/www/ShoftAfricaAppsCatalogue || exit

            # 3. Generate a clean Dockerfile on the fly
            echo "FROM nginx:stable-alpine
            RUN echo 'server { \
                listen 80; \
                location / { \
                    root /usr/share/nginx/html; \
                    index index.html index.htm; \
                    try_files \$uri \$uri/ /index.html; \
                } \
            }' > /etc/nginx/conf.d/default.conf
            COPY build/ /usr/share/nginx/html
            EXPOSE 80
            CMD [\"nginx\", \"-g\", \"daemon off;\"]" > Dockerfile.simple

            # 4. Build the lightweight Docker image instantly using pre-built files
            docker build -t shoft-africa-apps-catalogue:latest -f Dockerfile.simple .

            # 5. Swap the Docker container cleanly
            docker stop shoft-africa-apps-catalogue-container || true
            docker rm shoft-africa-apps-catalogue-container || true
            
            docker run -d \
              --name shoft-africa-apps-catalogue-container \
              --restart always \
              -p 127.0.0.1:3000:80 \
              shoft-africa-apps-catalogue:latest