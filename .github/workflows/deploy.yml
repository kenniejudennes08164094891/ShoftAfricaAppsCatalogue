name: Deploy ShoftAfrica App to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_IP }}
          username: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_USERNAME }}
          key: ${{ secrets.SHOFT_AFRICA_APPS_CATALOGUE_SSH_KEY }}
          script: |
            # 1. Enter the folder
            cd /var/www/ShoftAfricaAppsCatalogue || exit

            # 2. Check if it's a git repo, if not, clone it
            if [ ! -d ".git" ]; then
              git clone https://github.com/kenniejudennes08164094891/ShoftAfricaAppsCatalogue.git .
            else
              git pull origin main
            fi
            
            # 3. Cleanup to save 2GB RAM
            rm -rf node_modules build
            docker system prune -f
            
            # 4. Build Process
            npm install --legacy-peer-deps
            npm run build
            
            # 5. Generate Dockerfile (The React Router 404 Fix)
            echo "FROM nginx:stable-alpine
            RUN echo 'server { \
                listen 80; \
                location / { \
                    root /usr/share/nginx/html; \
                    index index.html index.htm; \
                    try_files \$uri \$uri/ /index.html; \
                } \
            }' > /etc/nginx/conf.d/default.conf
            COPY build/ /usr/share/nginx/html
            EXPOSE 80
            CMD [\"nginx\", \"-g\", \"daemon off;\"]" > Dockerfile.simple
            
            # 6. Build and Deploy Container
            docker build -t shoft-africa-apps-catalogue -f Dockerfile.simple .
            docker rm -f shoft-africa-apps-catalogue-container || true
            docker run -d --name shoft-africa-apps-catalogue-container --restart always -p 3000:80 shoft-africa-apps-catalogue